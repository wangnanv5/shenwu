[project]
name = "shenwu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wnn", email = "273213185@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "mss>=10.2.0",
    "munch>=4.0.0",
    "onnxruntime>=1.31.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyqt6>=6.11.0",
    "pywin32>=312",
    "schedule>=1.2.2",
    "windows-capture>=2.0.1",
]

[project.scripts]
shenwu = "main:cli"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
