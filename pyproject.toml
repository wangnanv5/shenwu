[project]
name = "shenwu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wnn", email = "273213185@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "onnxruntime-gpu==1.19.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
    "pyscreeze>=1.0.1",
    "pywin32>=312",
    "rapidocr-onnxruntime>=1.4.4",
    "schedule>=1.2.2",
]

[project.scripts]
shenwu = "shenwu:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
